apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route
  namespace: lab01
spec:
  parentRefs:
  - name: app
  rules:
  
  - matches:
    - path:
        type: PathPrefix
        value: /a
    backendRefs:
    - name: app-a
      port: 80

  - matches:
    - path:
        type: PathPrefix
        value: /b
    backendRefs:
    - name: app-b
      port: 80