apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-b
  namespace: lab01
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-b
  template:
    metadata:
      labels:
        app: app-b
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:v1.12.0
        ports:
        - containerPort: 80
