apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v2
  namespace: lab02
spec:
  replicas: 4
  selector:
    matchLabels:
      app: app-v2
  template:
    metadata:
      labels:
        app: app-v2
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:v1.12.0
        ports:
        - containerPort: 80
