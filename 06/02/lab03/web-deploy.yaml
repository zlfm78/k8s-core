apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: lab02
spec:
  replicas: 2

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
      - name: nginx
        image: nginx:1.29
        command: ["sh", "-c", "sleep 10; exec nginx -g 'daemon off;'"]
        ports:
        - containerPort: 80
